[workspace]
resolver = "3"
members = ["crates/*", "crates/oc-platform/*"]
# Vendored third-party crates (patched forks, see crates/vendor/*/PATCHES.md) are not workspace members.
exclude = ["crates/vendor"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# --- oc-platform deps (appended by platform port) ---
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
subtle = "2"
ryu-js = "1"
regex = "1"
url = "2"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls", "hostname"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
tracing = "0.1"
oc-js = { path = "crates/oc-platform/oc-js" }
oc-config = { path = "crates/oc-platform/oc-config" }
oc-db = { path = "crates/oc-platform/oc-db" }
oc-jobs = { path = "crates/oc-platform/oc-jobs" }
oc-netguard = { path = "crates/oc-platform/oc-netguard" }
oc-storage = { path = "crates/oc-platform/oc-storage" }
# --- oc-crdt deps (appended by crdt port) ---
yrs = "0.28"
# --- oc-text deps (appended by text port) ---
parley = { version = "=0.12.0", default-features = false, features = ["std"] }
skrifa = { version = "=0.44.0", default-features = false, features = ["std"] }
icu_properties = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
icu_segmenter = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
# --- oc-sheet deps (appended by sheet port) ---
calamine = { version = "0.36", default-features = false }
rust_xlsxwriter = { version = "0.99", default-features = false }
unicode-normalization = "0.1"
# --- oc-collab / oc-worker deps (appended by services port) ---
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
aes-gcm = "0.10"
hkdf = "0.12"
unicode-segmentation = "1"
# --- oc-render deps (appended by render port) ---
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
resvg = { version = "0.48", default-features = false, features = ["raster-images"] }
krilla = { version = "0.8", default-features = false, features = ["raster-images"] }
# ICC colour management (print export: RGB/Lab → CMYK through output profiles, gamut checks). Pure Rust, builds for
# wasm32 so the editor can soft-proof with the same maths.
moxcms = { version = "=0.8.1", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
libm = "0.2"
# --- oc-wasm deps (appended by wasm bridge) ---
wasm-bindgen = "0.2.129"
js-sys = "0.3.106"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
wasm-bindgen-test = "0.3"
# --- oc-api deps (appended by api port) ---
tower = { version = "0.5", default-features = false, features = ["util"] }
http-body-util = "0.1"
bytes = "1"
scrypt = { version = "0.11", default-features = false }
sha1 = "0.10"
form_urlencoded = "1"
percent-encoding = "2"
httpdate = "1"
ring = "0.17"
# ML-DSA (FIPS 204) passkeys, COSE alg -48: pure Rust (RustCrypto), pinned like the TS side pins @simplewebauthn.
ml-dsa = { version = "=0.1.1", default-features = false, features = ["alloc"] }
multer = "3"
# scrypt for password hashes: aws-lc (already linked through rustls) is native code, so it stays fast in
# unoptimized test builds (the pure-Rust scrypt crate takes ~20 s per hash at opt-level 0).
aws-lc-sys = "0.45"
# --- oc-render-svc deps (appended by render service port) ---
quick-xml = "0.41"
# --- oc-api deps: passkey CBOR and the TXT lookup behind custom domains ---
ciborium = "0.2"
kurbo = "0.13"
hickory-resolver = "0.26"
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
totp-rs = { version = "6", default-features = false, features = ["std"] }
# --- oc-import deps (appended by importers port) ---
hayro = { version = "0.8", default-features = false }
phf = { version = "0.13", default-features = false, features = ["macros"] }

# krilla with PDF/X output intents, PDF/X document info + XMP and overprint (crates/vendor/krilla/PATCHES.md).
[patch.crates-io]
krilla = { path = "crates/vendor/krilla" }
