name: images

# ARM64 deploy images for the Oracle Cloud free server (docs/deploy-oracle.md), pushed to GitHub's container
# registry. Built on GitHub's native arm64 runner (emulated builds of the Rust services take hours). Runs on demand
# (Actions → images → Run workflow) and for version tags, not on every push, to save the plan's free minutes.
on:
  workflow_dispatch:
    inputs:
      target:
        description: What to build
        type: choice
        options: [both, frontend, backend]
        default: both
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: images
  cancel-in-progress: false

# Each job keeps its Dockerfile cache mounts (cargo registry and target directory) in the Actions cache, keyed by
# Cargo.lock: the dependencies stay compiled and a new cache is only saved when they change. The workspace crates
# still recompile, because a fresh checkout gives their sources new timestamps.
jobs:
  backend:
    if: inputs.target != 'frontend'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        id: buildx
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - name: Image name
        id: names
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-runtime" >> "$GITHUB_OUTPUT"
      - name: Cargo cache
        id: cargo
        uses: actions/cache@v4
        with:
          path: cargo-cache
          key: images-arm64-backend-${{ hashFiles('Cargo.lock') }}
          restore-keys: images-arm64-backend-
      - name: Put the cargo cache into the builder
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            { "cargo-cache/registry": "/usr/local/cargo/registry", "cargo-cache/target": "/app/target" }
          skip-extraction: ${{ steps.cargo.outputs.cache-hit }}
      - name: Runtime image (Rust services)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: runtime
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.names.outputs.image }}:latest
            ${{ steps.names.outputs.image }}:${{ github.sha }}
            ${{ steps.names.outputs.image }}:${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
          cache-from: type=gha,scope=arm64-runtime
          cache-to: type=gha,scope=arm64-runtime,mode=max

  frontend:
    if: inputs.target != 'backend'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        id: buildx
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - name: Image name
        id: names
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-gateway" >> "$GITHUB_OUTPUT"
      - name: Cargo cache
        id: cargo
        uses: actions/cache@v4
        with:
          path: cargo-cache
          key: images-arm64-frontend-${{ hashFiles('Cargo.lock') }}
          restore-keys: images-arm64-frontend-
      - name: Put the cargo cache into the builder
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            { "cargo-cache/registry": "/usr/local/cargo/registry", "cargo-cache/target": "/app/target" }
          skip-extraction: ${{ steps.cargo.outputs.cache-hit }}
      - name: Gateway image (web app, engine)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: gateway
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.names.outputs.image }}:latest
            ${{ steps.names.outputs.image }}:${{ github.sha }}
            ${{ steps.names.outputs.image }}:${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
          cache-from: type=gha,scope=arm64-gateway
          cache-to: type=gha,scope=arm64-gateway,mode=max
