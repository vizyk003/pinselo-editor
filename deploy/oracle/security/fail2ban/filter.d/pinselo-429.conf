# Clients that keep going after the API's rate limit answered 429. Left out: the auth routes (pinselo-auth) and the AI
# connector and token API, which many users reach from a provider's shared addresses and are limited per token.
[Definition]
_client = "request":\{"remote_ip":"[^"]*","remote_port":"[^"]*","client_ip":"<ADDR>","proto":"[^"]*"
failregex = %(_client)s,"method":"[A-Z]+","host":"[^"]*","uri":"(?!/mcp|/v1/|/api/oauth/|/\.well-known/|/api/auth/|/api/account/)[^"]*".*"status":429[,}]
ignoreregex =
datepattern = "ts":{EPOCH}
