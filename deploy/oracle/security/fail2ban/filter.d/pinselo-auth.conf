# Failed sign-ins and over-limit auth requests in the gateway's JSON access log. The prefix pins the real client_ip
# field: quotes in client-controlled values are escaped in the log, so a header or URL cannot forge it.
[Definition]
_client = "request":\{"remote_ip":"[^"]*","remote_port":"[^"]*","client_ip":"<ADDR>","proto":"[^"]*"
failregex = %(_client)s,"method":"POST","host":"[^"]*","uri":"/api/auth/(?:login|mfa|magic/verify|reset|passkey/login/verify)(?:\?[^"]*)?".*"status":(?:401|403|429)[,}]
            %(_client)s,"method":"[A-Z]+","host":"[^"]*","uri":"/api/(?:auth|account)/[^"]*".*"status":429[,}]
ignoreregex =
datepattern = "ts":{EPOCH}
