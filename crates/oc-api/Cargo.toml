[package]
name = "oc-api"
description = "HTTP API service (Rust port of services/api, ADR-0001 strangler migration): same port, routes, cookies, status codes and JSON shapes as the Fastify app."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
oc-config = { workspace = true }
oc-db = { workspace = true }
oc-jobs = { workspace = true }
oc-js = { workspace = true }
oc-storage = { workspace = true }
oc-auth = { path = "../oc-platform/oc-auth" }
oc-mail = { path = "../oc-platform/oc-mail" }
oc-webhooks = { path = "../oc-platform/oc-webhooks" }
oc-netguard = { workspace = true }
oc-audit = { path = "../oc-platform/oc-audit" }
oc-gfonts = { path = "../oc-platform/oc-gfonts" }
oc-schema = { path = "../oc-schema" }
oc-editor-core = { path = "../oc-editor-core" }
oc-color = { path = "../oc-color" }
oc-crdt = { path = "../oc-crdt" }
oc-geometry = { path = "../oc-geometry" }
oc-social = { path = "../oc-social" }
oc-import = { path = "../oc-import" }
axum = { workspace = true, features = ["matched-path", "original-uri"] }
tokio = { workspace = true, features = ["signal", "process"] }
sqlx = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
uuid = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
url = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
subtle = { workspace = true }
aws-lc-sys = { workspace = true }
ring = { workspace = true }
ml-dsa = { workspace = true }
ciborium = { workspace = true }
hickory-resolver = { workspace = true }
jsonwebtoken = { workspace = true }
totp-rs = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
http-body-util = { workspace = true }
multer = { workspace = true }
form_urlencoded = { workspace = true }
percent-encoding = { workspace = true }
httpdate = { workspace = true }
yrs = { workspace = true }
unicode-normalization = { workspace = true }
libm = { workspace = true }
resvg = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
# The AI connector joins the collab server as a Hocuspocus client (mcp/live.rs).
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }

[dev-dependencies]
tower = { workspace = true }
tokio = { workspace = true, features = ["signal", "process", "test-util"] }
