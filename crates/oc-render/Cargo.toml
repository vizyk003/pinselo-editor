[package]
name = "oc-render"
description = "Pinselo renderer (Rust port of @oc/render-core + @oc/render-canvaskit): display list, tiny-skia raster, SVG and PDF"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
default = ["complex-scripts", "pdf"]
# The vector PDF writer (krilla), its print colour management (oc-color) and PDF/X checker. Not needed to paint (the browser build leaves it out).
pdf = ["dep:krilla", "dep:oc-color", "dep:miniz_oxide"]
# Dictionary line breaking for Thai/Lao/Khmer/Myanmar (oc-text); off in lean browser builds.
complex-scripts = ["oc-text/complex-scripts"]
# Filesystem font and asset loading (server). The library itself takes bytes, so it builds for wasm32.
native = ["oc-text/native"]

[dependencies]
oc-schema = { path = "../oc-schema" }
oc-geometry = { path = "../oc-geometry" }
oc-text = { path = "../oc-text", default-features = false }
oc-color = { path = "../oc-color", optional = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
indexmap = { version = "2", features = ["serde"] }
thiserror = { workspace = true }
base64 = { workspace = true }
libm = { workspace = true }
skrifa = { workspace = true }
tiny-skia = { workspace = true }
resvg = { workspace = true }
krilla = { workspace = true, optional = true }
image = { workspace = true }
# Inflate for the PDF/X structure checker (pdfx_check).
miniz_oxide = { version = "0.8", optional = true }

[dev-dependencies]
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
# PDF rasteriser: renders the written PDFs back so the tests can compare them with the painter.
hayro = { version = "0.8", default-features = false }
# PS-1 baselines (tests/ps1.rs): pixel hashes.
sha2 = { workspace = true }
