[package]
name = "oc-collab"
description = "Real-time sync server (Rust port of services/collab): the Hocuspocus 3 WebSocket protocol over yrs, with Postgres persistence (ack-after-persist)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
oc-config = { workspace = true }
oc-db = { workspace = true }
oc-jobs = { workspace = true }
oc-js = { workspace = true }
oc-auth = { path = "../oc-platform/oc-auth" }
oc-crdt = { path = "../oc-crdt" }
yrs = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true }
indexmap = "2"

[dev-dependencies]
tokio = { workspace = true, features = ["process", "io-util"] }
url = { workspace = true }
