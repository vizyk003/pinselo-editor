[package]
name = "oc-social"
description = "Content Planner social publishing (Rust port of services/api/src/social): network adapters, OAuth connect, token crypto, account store, the publish job and the scheduler sweep. Shared by oc-worker and the future oc-api."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["native"]
# Spawns ffmpeg for the PNG → JPEG fallback of the render service export.
native = ["tokio/process"]

[dependencies]
oc-config = { workspace = true }
oc-db = { workspace = true }
oc-jobs = { workspace = true }
oc-js = { workspace = true }
oc-storage = { workspace = true }
oc-mail = { path = "../oc-platform/oc-mail" }
oc-crdt = { path = "../oc-crdt" }
tokio = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
uuid = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true, features = ["multipart"] }
regex = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
subtle = { workspace = true }
aes-gcm = { workspace = true }
hkdf = { workspace = true }
unicode-segmentation = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
