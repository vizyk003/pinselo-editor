[package]
name = "oc-worker"
description = "Background worker (Rust port of services/worker): email, webhook, account export/delete, social publish, maintenance, object GC."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
oc-config = { workspace = true }
oc-db = { workspace = true }
oc-jobs = { workspace = true }
oc-js = { workspace = true }
oc-storage = { workspace = true }
oc-mail = { path = "../oc-platform/oc-mail" }
oc-webhooks = { path = "../oc-platform/oc-webhooks" }
oc-audit = { path = "../oc-platform/oc-audit" }
oc-crdt = { path = "../oc-crdt" }
oc-social = { path = "../oc-social" }
tokio = { workspace = true, features = ["signal"] }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
uuid = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
zip = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util"] }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
